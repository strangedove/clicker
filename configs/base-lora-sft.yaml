# Base config for LoRA SFT training
# Use as a base_config in experiment-specific configs to avoid repetition.
#
# Usage in a child config:
#   base_config: configs/base-lora-sft.yaml
#   model_name_or_path: my-new-model
#   data_config: data/my-data.yaml

# Training
num_train_epochs: 1
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 4
gradient_checkpointing: true
learning_rate: 2.0e-5
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.01
max_grad_norm: 1.0

# LoRA
use_peft: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
lora_target_modules: all-linear

# SFT / data
max_length: 4096
truncation_strategy: split
dataset_text_field: text

# Saving
save_strategy: steps
save_steps: 200
save_total_limit: 3
save_only_model: true

# Logging
logging_steps: 1
report_to:
  - wandb

# Hardware
bf16: true
dataloader_num_workers: 2
remove_unused_columns: false
