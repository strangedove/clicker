[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clicker"
description = "Clicker train your language models"
authors = [
    { name = "Fizz", email = "fizzarolli@riseup.net" }
]
readme = { file = "README.md", content-type = "text/markdown" }
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "transformers", "huggingface", "language modeling", "post-training", "rlhf", "sft", "dpo", "grpo"
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.4.0",
    "datasets>=3.0.0",
    "deepspeed>=0.18.5",
    "huggingface_hub>=0.25.0",
    "numpy>=1.24.0",
    "packaging>=21.0",
    "pandas>=2.0.0",
    "peft>=0.18.1",
    "psutil>=5.9.0",
    "pyarrow>=15.0.0",
    "pyyaml>=6.0",
    "safetensors>=0.4.0",
    "torch>=2.0.0",
    "transformers==4.57.3",
    "wandb>=0.24.1",
]
dynamic = ["version"]

[project.urls]
#Homepage = "https://github.com/huggingface/trl"

[project.scripts]
clicker = "clicker.cli:main"

[project.optional-dependencies]
bco = [
    "scikit-learn",
    "joblib"
]
deepspeed = [
    "deepspeed>=0.14.4"
]
judges = [
    "openai>=1.23.2",
    "llm-blender>=0.0.2"
]
liger = [
    "liger-kernel>=0.6.2"
]
cce = [
    "cut-cross-entropy @ git+https://github.com/axolotl-ai-cloud/ml-cross-entropy.git"
]
quality = [
    "pyrefly",
    "pre-commit",
    "hf-doc-builder"
]
quantization = [
    "bitsandbytes"
]
scikit = [
    "scikit-learn"
]
vllm = [
    "vllm==0.10.2",
    "fastapi",
    "pydantic",
    "requests",
    "uvicorn"
]
vlm = [
    "Pillow",
    "torchvision",
    "num2words==0.5.14"
]
dev = [
    # bco
    "scikit-learn",
    "joblib",
    # cce (axolotl ml-cross-entropy fork for memory-efficient SFT)
    "cut-cross-entropy @ git+https://github.com/axolotl-ai-cloud/ml-cross-entropy.git",
    # deepspeed
    "deepspeed>=0.14.4",
    # judges
    "openai>=1.23.2",
    "llm-blender>=0.0.2",
    # liger
    "liger-kernel>=0.6.2",
    # quality
    "pyrefly",
    "pre-commit",
    "hf-doc-builder",
    # quantization
    "bitsandbytes",
    # scikit: included in bco
    # test
    "parameterized",
    # vllm: not included in dev by default due to CUDA error; see GH-4228
    # vlm
    "Pillow",
    "torchvision",
    "num2words==0.5.14"
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
path = "clicker/__init__.py"
pattern = "__version__ = '(?P<version>[^']+)'"

[tool.hatch.envs.default]
installer = "uv"

[tool.hatch.envs.dev]
features = [
    "dev"
]

[tool.hatch.envs.hatch-test]
features = [
    "dev"
]

[tool.coverage.run]
branch = true

[tool.ruff]
target-version = "py39"
line-length = 119
src = ["trl"]

[tool.ruff.lint]
ignore = [
    "B028", # warning without explicit stacklevel
    "C408", # dict() calls (stylistic)
    "C901", # function complexity
    "E501",
]
extend-select = ["E", "F", "I", "W", "UP", "B", "T", "C"]

[tool.ruff.lint.per-file-ignores]
# Allow prints in auxiliary scripts
"examples/**.py" = ["T201"]
"scripts/**.py" = ["T201"]
# Ignore import violations in all `__init__.py` files.
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["trl"]

[tool.basedpyright]
reportUnusedImport = "none"
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "low_priority: marks tests as low priority (deselect with '-m \"not low_priority\"')"
]
addopts = [
    "-k", "not experimental",
]

[tool.pyrefly]
project-includes = ["**/*"]
project-excludes = [
    "**/node_modules",
    "**/__pycache__",
    "**/*venv/**/*",
]
